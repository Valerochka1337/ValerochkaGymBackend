name: valerochka-gym
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes: ["postgres:/var/lib/postgresql/data"]
    networks: [private]
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/gym
      DATABASE_USER: gym
    ports: ["127.0.0.1:18080:8080"]
    networks: [private, outbound]
    mem_limit: 768m
    cpus: 1.0
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  private: {internal: true}
  outbound: {}
volumes:
  postgres:
