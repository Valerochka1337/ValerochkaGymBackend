spring:
  application:
    name: valerochka-gym-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gym}
    username: ${DATABASE_USER:gym}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 8
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/master.yaml
    analytics-enabled: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.starttls.required: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  forward-headers-strategy: native
  address: 0.0.0.0
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 10MB
    threads:
      max: 40
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
gym:
  admin-origin: ${ADMIN_ORIGIN:https://api.valerochkagym.tech}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  mail-from: ${MAIL_FROM:noreply@valerochkagym.tech}
  mail-enabled: ${MAIL_ENABLED:false}
  token-pepper: ${TOKEN_PEPPER}
springdoc:
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
